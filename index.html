<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E7C86">
<title>Sổ hạnh kiểm 11D3</title>
<style>
:root{
  --paper:#FFFFFF; --bg:#F1F7F8; --bg2:#E9F2F4;
  --ink:#22383F; --muted:#6C8A93; --faint:#9CB4BB;
  --rule:#DCE9EC; --rule2:#EDF4F6;
  --teal:#0E7C86; --teal-ink:#0A5C64; --teal-soft:#E2F2F4;
  --green:#1E8449; --green-soft:#E4F4E9;
  --red:#C0392B;   --red-soft:#FBEAE7;
  --amber:#B9761C; --amber-soft:#FBF0DF;
  --blue:#1F618D;  --blue-soft:#E4EFF7;
  --shadow:0 10px 34px rgba(34,56,63,.16);
  --rail:236px; --nav-h:62px; --top-h:auto;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Aptos','Aptos Display','Aptos Narrow','Segoe UI Variable Text','Segoe UI',
    -apple-system,BlinkMacSystemFont,'SF Pro Text','Roboto','Noto Sans',system-ui,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
svg{display:block}
.hide{display:none !important}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.r0{color:var(--green)} .r1{color:var(--blue)} .r2{color:var(--amber)} .r3{color:var(--red)}
.b0{background:var(--green)} .b1{background:var(--blue)} .b2{background:var(--amber)} .b3{background:var(--red)}
.s0{background:var(--green-soft)} .s1{background:var(--blue-soft)} .s2{background:var(--amber-soft)} .s3{background:var(--red-soft)}
.zero{color:var(--faint)}

/* ───────────────────────── ĐĂNG NHẬP ───────────────────────── */
#login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
       padding:32px 24px;max-width:440px;margin:0 auto}
.mark{font-size:14.5px;letter-spacing:.01em;color:var(--muted)}
.classname{font-size:66px;font-weight:800;letter-spacing:-.035em;line-height:.92;color:var(--teal-ink);margin:8px 0 4px}
.subline{font-size:15px;color:var(--muted);margin-bottom:34px}
.subline b{color:var(--ink);font-weight:600}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.inp{width:100%;padding:13px 14px;border:1.5px solid var(--rule);border-radius:12px;
     background:var(--paper);outline:none;transition:border-color .12s,box-shadow .12s}
.inp:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.inp.s{padding:9px 11px;font-size:14.5px;border-radius:9px}
textarea.inp{min-height:88px;resize:vertical;line-height:1.5}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.btn{width:100%;padding:13px;border-radius:12px;background:var(--teal);color:#fff;font-weight:700;font-size:15.5px;
     display:flex;align-items:center;justify-content:center;gap:8px;transition:background .12s}
.btn:hover{background:var(--teal-ink)}
.btn.ghost{background:var(--paper);color:var(--teal-ink);border:1.5px solid var(--rule)}
.btn.ghost:hover{background:var(--teal-soft)}
.btn.danger{background:var(--red)} .btn.danger:hover{background:#9E2F23}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.55;cursor:default}
.err{color:var(--red);font-size:14px;margin-top:12px;min-height:20px}
.hint{font-size:13px;color:var(--faint);margin-top:22px;line-height:1.55}

/* ───────────────────────── KHUNG ỨNG DỤNG ───────────────────────── */
#app{min-height:100dvh}
#rail{display:none}
#main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px)}

#top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.topline{display:flex;align-items:center;gap:12px;padding:11px 16px 9px}
.topline h1{font-size:18px;font-weight:700;margin:0;flex:1;letter-spacing:-.015em}
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 auto}
.dot.busy{background:var(--amber);animation:pulse 1s infinite}
.dot.off{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
.ava{width:34px;height:34px;border-radius:50%;background:var(--teal-soft);color:var(--teal-ink);
     font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.periodbar{display:flex;gap:7px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.periodbar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1.5px solid var(--rule);background:var(--paper);
      font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;transition:all .12s}
.chip:hover{border-color:var(--teal)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.tiny{padding:5px 11px;font-size:13px}
.chip.month{background:var(--bg2);border-color:transparent;color:var(--teal-ink);font-weight:700}

.view{padding:12px 0 32px}
.wrap{max-width:1180px;margin:0 auto}
.pad{padding:0 16px}
.sechead{display:flex;align-items:baseline;gap:10px;margin:22px 16px 9px}
.sechead h2{font-size:13px;font-weight:700;color:var(--muted);margin:0;letter-spacing:.02em;text-transform:uppercase}
.sechead .more{margin-left:auto;font-size:13px;color:var(--teal);font-weight:600}
.view > .wrap > .sechead:first-child{margin-top:4px}

/* ───────────────────────── SỔ KẺ DÒNG ───────────────────────── */
.register{background:var(--paper);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.row{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--rule2);
     width:100%;text-align:left;transition:background .1s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--bg)}
.row.sel{background:var(--teal-soft)}
.row .idx{width:22px;font-size:11.5px;color:var(--faint);flex:0 0 22px;font-variant-numeric:tabular-nums}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:12.5px;color:var(--muted)}
.row .spark{flex:0 0 auto;opacity:.85}
.score{flex:0 0 auto;text-align:right;min-width:56px}
.score .n{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:block;line-height:1.1}
.score .l{font-size:10.5px;font-weight:700;display:block}
.grouphead{padding:7px 16px;background:var(--bg);font-size:11.5px;font-weight:700;color:var(--muted);
           border-bottom:1px solid var(--rule2);letter-spacing:.03em;text-transform:uppercase}
.check{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:1.7px solid var(--rule);
       display:flex;align-items:center;justify-content:center;background:var(--paper)}
.check.on{background:var(--teal);border-color:var(--teal)}
.check svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.check.on svg{opacity:1}

.tools{padding:0 16px 10px;display:flex;gap:8px;align-items:center}
.tools .inp{flex:1}
.filters{display:flex;gap:7px;padding:0 16px 11px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}

/* thanh hành động khi chọn nhiều */
#bulkbar{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));
  z-index:45;background:var(--ink);color:#fff;border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:10px;
  box-shadow:var(--shadow);opacity:0;visibility:hidden;pointer-events:none;transform:translateY(14px);
  transition:opacity .16s,transform .16s,visibility .16s}
#bulkbar.on{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0)}
#bulkbar .x{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.16);color:#fff;
  display:flex;align-items:center;justify-content:center}
#bulkbar .c{flex:1;font-size:14.5px;font-weight:600}
#bulkbar button{padding:8px 13px;border-radius:9px;font-size:14px;font-weight:700}
#bulkbar .go{background:#fff;color:var(--ink)}
#bulkbar .cx{background:rgba(255,255,255,.16);color:#fff}

/* ───────────────────────── BẢNG ───────────────────────── */
.tablewrap{overflow-x:auto;background:var(--paper);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
table{border-collapse:collapse;width:max-content;min-width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--rule2);white-space:nowrap;text-align:center}
th{background:var(--teal-soft);color:var(--teal-ink);font-weight:700;font-size:12px;position:sticky;top:0;z-index:2;
   letter-spacing:.02em}
td.name,th.name{position:sticky;left:0;background:var(--paper);text-align:left;font-weight:600;z-index:1;
   min-width:158px;border-right:1px solid var(--rule)}
th.name{background:var(--teal-soft);z-index:3}
td.v{font-variant-numeric:tabular-nums;font-weight:700}
tr:hover td{background:var(--bg)} tr:hover td.name{background:var(--bg)}
.c0{background:var(--green-soft);color:var(--green)}
.c1{background:var(--blue-soft);color:var(--blue)}
.c2{background:var(--amber-soft);color:var(--amber)}
.c3{background:var(--red-soft);color:var(--red)}

/* ───────────────────────── THỐNG KÊ ───────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);
      border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.kpi{background:var(--paper);padding:13px 16px}
.kpi .n{font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:1px}
.kpi .sub{font-size:11.5px;color:var(--faint);margin-top:2px}
.panelbox{background:var(--paper);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:14px 16px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}
.legend span{font-size:12.5px;color:var(--muted);display:flex;align-items:center}
.legend b{color:var(--ink);margin-left:4px;font-variant-numeric:tabular-nums}
.distbar{display:flex;height:26px;border-radius:7px;overflow:hidden;background:var(--rule2)}
.distbar div{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:800}
.hbars{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.hbar{display:grid;grid-template-columns:1fr auto;gap:4px}
.hbar .t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .v{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}
.hbar .track{grid-column:1/3;height:7px;border-radius:99px;background:var(--rule2);overflow:hidden}
.hbar .fill{height:100%;border-radius:99px}

/* ───────────────────────── LỊCH SỬ ───────────────────────── */
.entry{display:flex;gap:11px;padding:10px 16px;border-bottom:1px solid var(--rule2);align-items:flex-start}
.entry .pt{flex:0 0 46px;text-align:right;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;padding-top:1px}
.entry .bd{flex:1;min-width:0}
.entry .bd b{font-weight:600;font-size:15px;display:block}
.entry .bd .meta{font-size:12px;color:var(--muted);margin-top:1px}
.entry .bd .note{font-size:12.5px;color:var(--ink);background:var(--bg);border-radius:7px;padding:5px 8px;margin-top:5px;display:inline-block}
.entry .act{flex:0 0 auto;display:flex;gap:5px}
.entry .act button{padding:5px 8px;border-radius:7px;background:var(--bg);font-size:11.5px;font-weight:700;color:var(--muted)}
.entry .act button:hover{background:var(--rule2);color:var(--ink)}
.remarkbox{margin:0 16px 12px;padding:12px 14px;background:var(--amber-soft);border-radius:11px}
.remarkbox .h{font-size:11.5px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.03em}
.remarkbox p{margin:5px 0 0;font-size:14.5px;line-height:1.55}

.multistrip{display:flex;align-items:center;gap:8px;margin:0 16px 11px;padding:9px 10px 9px 13px;
  border-radius:12px;background:var(--teal-soft);color:var(--teal-ink);font-size:13.5px;font-weight:600}
.multistrip .t{flex:1;min-width:0}
.multistrip button{flex:0 0 auto;padding:6px 11px;border-radius:9px;background:var(--paper);
  font-size:13px;font-weight:700;color:var(--teal-ink);border:1px solid rgba(14,124,134,.18)}
.multistrip button:hover{background:var(--bg2)}

/* ───────────────────────── ĐIỀU HƯỚNG ───────────────────────── */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);
        border-top:1px solid var(--rule);display:flex;padding-bottom:env(safe-area-inset-bottom)}
#tabbar button{flex:1;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:3px;font-size:10.5px;font-weight:600;color:var(--muted)}
.ic{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
#tabbar button{position:relative}
#tabbar button.on{color:var(--teal)}
#tabbar button.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--teal)}
#tabbar button.on .ic{stroke-width:2.15}

/* ───────────────────────── PANEL (sheet / drawer) ───────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(34,56,63,.42);z-index:50;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
#panel{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--paper);
  border-radius:20px 20px 0 0;box-shadow:var(--shadow);max-height:90dvh;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .24s cubic-bezier(.22,.72,.28,1)}
#panel.on{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){#panel,.scrim,#bulkbar{transition:none}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--rule);margin:9px auto 3px;flex:0 0 auto}
#panel .ptop{padding:6px 18px 12px;border-bottom:1px solid var(--rule);flex:0 0 auto;display:flex;align-items:flex-start;gap:10px}
#panel .ptop .tt{flex:1;min-width:0}
#panel .ptop h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.015em}
#panel .ptop p{margin:2px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45}
#panel .pclose{flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:var(--bg);display:flex;
  align-items:center;justify-content:center;color:var(--muted)}
#panel .pbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(20px + env(safe-area-inset-bottom))}

.seg{display:flex;gap:6px;padding:12px 18px 6px}
.seg button{flex:1;padding:9px;border-radius:10px;background:var(--bg);font-weight:700;font-size:14.5px;color:var(--muted)}
.seg button.on.minus{background:var(--red-soft);color:var(--red)}
.seg button.on.plus{background:var(--green-soft);color:var(--green)}
.seg button.on.neutral{background:var(--teal-soft);color:var(--teal-ink)}
.item{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--rule2);
      width:100%;text-align:left}
.item:hover{background:var(--bg)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:500;font-size:15px;line-height:1.32}
.item .t span{font-size:11.5px;color:var(--faint)}
.item .p{flex:0 0 auto;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.pform{padding:14px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;display:block}
.rowbtns{display:flex;gap:8px;margin-top:13px}
.note{font-size:12.5px;color:var(--faint);line-height:1.55;padding:10px 16px}
.editline{display:flex;gap:7px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--rule2)}
.editline .inp{padding:8px 10px;font-size:14px;border-radius:8px}
.editline .w1{flex:0 0 52px} .editline .w2{flex:1 1 auto;min-width:0} .editline .w3{flex:0 0 58px}
.editline .del{flex:0 0 auto;padding:7px 9px;border-radius:8px;background:var(--red-soft);color:var(--red);
               font-weight:700;font-size:12px}
.empty{padding:44px 28px;text-align:center;color:var(--muted);font-size:14.5px;line-height:1.6}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}

#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));z-index:80;
  background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow);font-size:14.5px;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(14px);
  transition:opacity .16s,transform .16s,visibility .16s}
#toast.on{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0)}
#toast .msg{flex:1}
#toast .undo{font-weight:700;color:#7EDCE2;padding:4px 6px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.32);border-top-color:#fff;
      border-radius:50%;animation:sp .7s linear infinite;flex:0 0 auto}
.btn .spin{border-color:rgba(255,255,255,.4);border-top-color:#fff}
@keyframes sp{to{transform:rotate(360deg)}}

/* ───────────────────────── DESKTOP ───────────────────────── */
@media (min-width:1024px){
  #rail{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:var(--rail);
        background:var(--paper);border-right:1px solid var(--rule);padding:22px 0 14px;z-index:35}
  #rail .brand{padding:0 20px 20px}
  #rail .brand .k{font-size:34px;font-weight:800;letter-spacing:-.035em;color:var(--teal-ink);line-height:1}
  #rail .brand .s{font-size:11.5px;color:var(--muted);margin-top:2px}
  #rail nav{display:flex;flex-direction:column;gap:2px;padding:0 12px}
  #rail nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
        font-size:14.5px;font-weight:600;color:var(--muted);text-align:left}
  #rail nav button:hover{background:var(--bg)}
  #rail nav button.on{background:var(--teal-soft);color:var(--teal-ink)}
  #rail .foot{margin-top:auto;padding:14px 16px 0;border-top:1px solid var(--rule);
        display:flex;align-items:center;gap:10px}
  #rail .foot .who{flex:1;min-width:0}
  #rail .foot .who b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #rail .foot .who span{font-size:11.5px;color:var(--muted)}
  #main{padding-left:var(--rail);padding-bottom:20px}
  #tabbar{display:none}
  .topline{padding:15px 28px 11px}
  .topline h1{font-size:22px}
  .periodbar{padding:0 28px 12px}
  .pad,.tools,.filters,.sechead,.note,.entry,.row,.kpi,.panelbox,.grouphead,.editline{padding-left:28px;padding-right:28px}
  .multistrip{margin-left:28px;margin-right:28px}
  .sechead{margin-left:0;margin-right:0}
  .register,.tablewrap,.kpis,.panelbox{border-radius:14px;border:1px solid var(--rule);margin:0 28px}
  .register .row:last-child{border-bottom:0}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .view{padding:16px 0 40px}
  #toast{left:auto;right:28px;bottom:28px;max-width:420px}
  #bulkbar{left:calc(var(--rail) + 28px);right:28px;bottom:28px}
  #panel{left:auto;right:0;top:0;bottom:0;width:440px;max-height:none;border-radius:0;
         transform:translateX(103%);border-left:1px solid var(--rule)}
  #panel.on{transform:translateX(0)}
  .grab{display:none}
  #panel .ptop{padding-top:20px}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;align-items:start}
  .twocol > *{margin-left:0 !important;margin-right:0 !important}
  .twocol-wrap{padding:0 28px}
}
@media (min-width:1400px){ .wrap{max-width:1320px} }

/* ───────────────────────── BẢN IN ───────────────────────── */
#printArea{display:none}
@media print{
  body{background:#fff}
  #login,#app,#panel,.scrim,#toast,#bulkbar,#tabbar,#rail{display:none !important}

    text-align:left;padding:5pt 6pt;border-bottom:1px solid #bbb;font-size:8.5pt}

    print-color-adjust:exact;border-radius:4pt;font-size:9.5pt}
}

<body>

<!-- ═══════════════════ ĐĂNG NHẬP ═══════════════════ -->

<div id="toast"><span class="msg" id="toastMsg"></span><button class="undo hide" id="toastUndo">Hoàn tác</button></div>
<div id="printArea"></div>

<script>
'use strict';
/* ═══════════════ BACKEND (đã cố định) ═══════════════ */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbz1x-UG4_Rk3M3_APc-hJ0VHns2GfvPtR6T_F8nl4KlEHnNsiYGMbY0Vc4moiIRy8gO/exec';

/* chỉ số cột của một bản ghi (mảng gọn từ backend) */
const E_ID=0, E_LUC=1, E_THANG=2, E_TUAN=3, E_MA=4, E_TO=5,
      E_LOAI=6, E_MUC=7, E_ND=8, E_DIEM=9, E_EM=10, E_TEN=11, E_GC=12;

const MONTHS_YEAR = [9,10,11,12,1,2,3,4,5];

/* ═══════════════ LƯU TRỮ AN TOÀN ═══════════════ */
const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k] ?? null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};

const S = {
  token: store.get('hk_token') || '',
  me:null, cfg:null, students:[], cong:[], tru:[], accounts:[], thongBao:null,
  entries:[], remarks:[], loaded:new Set(), allLoaded:false,
  thang:null, tuan:1, view:'ghi', filterTo:'all', q:'',
  multi:false, sel:new Set(),
  ctxMa:null, ctxTab:'tru', panelKind:'', bulkNote:'',
  lsFilter:{ tu:null, den:null, to:'all', hs:'all', loai:'all' },
  busy:false, lastSync:null, pollT:null
};

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nz  = n => (n>0?'+':'') + n;
const initials = n => String(n||'').trim().split(/\s+/).slice(-2).map(w=>w[0]||'').join('').toUpperCase();

/* ═══════════════ ICON ═══════════════ */
const ICON = {
  ghi:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  bang:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',
  tk:'<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>',
  ls:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  cai:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.5-2.6l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.6a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4Z"/>',
  check:'<path d="m4 12 5 5L20 6"/>'
};
const NAV = [
  {v:'ghi',  t:'Ghi điểm', el:'#vGhi'},
  {v:'bang', t:'Bảng lớp', el:'#vBang'},
  {v:'tk',   t:'Thống kê', el:'#vTK'},
  {v:'ls',   t:'Lịch sử',  el:'#vLS'},
  {v:'cai',  t:'Cài đặt',  el:'#vCai'}
];

/* ═══════════════ GỌI API ═══════════════ */
async function api(action, payload){
  setBusy(true);
  try{
    const res = await fetch(GAS_URL, {
      method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action, token:S.token, payload:payload||{}})
    });
    const j = await res.json();
    if(!j.ok) throw new Error(j.error || 'Không rõ lỗi');
    S.lastSync = new Date();
    setSync('ok');
    return j;
  }catch(e){
    setSync('off');
    throw e;
  }finally{ setBusy(false); }
}

function setBusy(b){ S.busy=b; if(b) setSync('busy'); }
function setSync(state){
  const d=$('#syncDot'), t=$('#syncTxt');
  if(!d) return;
  d.className = 'dot' + (state==='busy'?' busy':state==='off'?' off':'');
  if(state==='busy'){ t.textContent='Đang đồng bộ…'; return; }
  if(state==='off'){ t.textContent='Mất kết nối'; return; }
  t.textContent = S.lastSync ? 'Cập nhật ' + S.lastSync.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}) : '—';
}

/* ═══════════════ TOAST ═══════════════ */
let toastT=null;
function toast(msg, undoFn){
  clearTimeout(toastT);
  $('#toastMsg').innerHTML = msg;
  const u=$('#toastUndo');
  u.classList.toggle('hide', !undoFn);
  u.onclick = undoFn ? ()=>{ hideToast(); undoFn(); } : null;
  $('#toast').classList.add('on');
  toastT = setTimeout(hideToast, undoFn ? 5500 : 2600);
}
function hideToast(){ $('#toast').classList.remove('on'); }
function err(e){ toast(esc(e && e.message ? e.message : String(e))); }

/* ═══════════════ ĐĂNG NHẬP ═══════════════ */
$('#lgPin').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
$('#lgEmail').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#lgPin').focus(); });
$('#lgBtn').addEventListener('click', doLogin);

async function doLogin(){
  const btn=$('#lgBtn'), box=$('#lgErr');
  box.textContent=''; btn.innerHTML='<span class="spin"></span>'; btn.disabled=true;
  try{
    const r = await api('login', {email:$('#lgEmail').value.trim(), pin:$('#lgPin').value});
    S.token=r.token; store.set('hk_token', S.token);
    await boot();
  }catch(e){ box.textContent = e.message; }
  finally{ btn.textContent='Vào sổ'; btn.disabled=false; }
}

async function boot(){
  const b = await api('bootstrap');
  S.me=b.me; S.cfg=b.cfg; S.students=b.students; S.cong=b.cong; S.tru=b.tru;
  S.accounts=b.accounts||[]; S.thongBao=b.thongBao||null;
  S.thang = S.cfg.thang;
  if(S.tuan > S.cfg.soTuan) S.tuan = 1;
  S.filterTo = (S.me.role==='Tổ trưởng') ? String(S.me.to) : 'all';
  S.entries=[]; S.remarks=[]; S.loaded=new Set(); S.allLoaded=false;
  await loadMonths([S.thang]);

  $('#login').classList.add('hide');
  $('#app').classList.remove('hide');
  ['rlName'].forEach(id=>$('#'+id).textContent=S.me.name);
  $('#rlRole').textContent = S.me.role + (S.me.role==='Tổ trưởng' ? ' · tổ '+S.me.to : '');
  $('#rlAva').textContent = initials(S.me.name);
  $('#hAva').textContent = initials(S.me.name);
  buildNav();
  renderAll();
  startPoll();
}

async function loadMonths(list, force){
  const need = list.filter(m => force || !S.loaded.has(m));
  if(!need.length) return;
  const r = await api('entries', {thangs:need});
  S.entries = S.entries.filter(e => need.indexOf(e[E_THANG])===-1).concat(r.entries);
  S.remarks = S.remarks.filter(x => need.indexOf(x.thang)===-1).concat(r.remarks||[]);
  need.forEach(m=>S.loaded.add(m));
}
async function loadAllMonths(force){
  if(S.allLoaded && !force) return;
  const r = await api('entries', {});
  S.entries = r.entries; S.remarks = r.remarks||[];
  S.loaded = new Set(MONTHS_YEAR); S.allLoaded = true;
}

/* ═══════════════ ĐỒNG BỘ ĐỊNH KỲ ═══════════════ */
function startPoll(){
  clearInterval(S.pollT);
  S.pollT = setInterval(()=>{ if(document.visibilityState==='visible' && !S.busy) refresh(true); }, 60000);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible' && !S.busy) refresh(true);
  });
}
async function refresh(quiet){
  if(quiet && (S.panelKind || S.view==='cai')) return;
  try{
    if(S.allLoaded) await loadAllMonths(true);
    else await loadMonths(Array.from(S.loaded), true);
    renderAll();
    if(!quiet) toast('Đã cập nhật dữ liệu mới nhất.');
  }catch(e){ if(!quiet) err(e); }
}

/* ═══════════════ TÍNH ĐIỂM ═══════════════ */
function entriesOf(ma, thang, tuan){
  return S.entries.filter(e => e[E_MA]===ma
    && (thang==null || e[E_THANG]===thang)
    && (tuan==null || e[E_TUAN]===tuan));
}
function weekScore(ma, tuan, thang){
  const t = thang==null ? S.thang : thang;
  let s=0; for(const e of S.entries) if(e[E_MA]===ma && e[E_THANG]===t && e[E_TUAN]===tuan) s+=e[E_DIEM];
  return s;
}
function weekSplit(ma, tuan, thang){
  const t = thang==null ? S.thang : thang;
  let p=0,m=0;
  for(const e of S.entries) if(e[E_MA]===ma && e[E_THANG]===t && e[E_TUAN]===tuan){ e[E_DIEM]>0 ? p+=e[E_DIEM] : m+=e[E_DIEM]; }
  return {p,m};
}
function monthTotal(ma, thang){
  const t = thang==null ? S.thang : thang;
  let s=0; for(const e of S.entries) if(e[E_MA]===ma && e[E_THANG]===t) s+=e[E_DIEM];
  return s;
}
function monthAvg(ma, thang){ return S.cfg.soTuan ? monthTotal(ma,thang)/S.cfg.soTuan : 0; }
function rankIdx(v){
  const t=S.cfg.thresholds;
  for(let i=0;i<t.length;i++) if(v >= t[i].san) return i;
  return t.length-1;
}
function rankName(v){ return S.cfg.thresholds[rankIdx(v)].ten; }
function activeStudents(){ return S.students.filter(s=>s.trangThai!=='Nghỉ học' && s.trangThai!=='Chuyển lớp'); }
function stu(ma){ return S.students.find(s=>s.ma===ma); }
function canScore(to){ return S.me.role!=='Tổ trưởng' || String(S.me.to)===String(to); }
function isGVCN(){ return S.me.role==='GVCN' || S.me.role==='Quản trị'; }
function isAdmin(){ return isGVCN() || S.me.role==='Lớp trưởng'; }
function catItem(loai, ma){
  const src = loai==='Cộng' ? S.cong : S.tru;
  return src.find(c=>c.ma===ma);
}
function remarkOf(ma, thang){
  const t = thang==null ? S.thang : thang;
  return S.remarks.find(r=>r.maHS===ma && r.thang===t);
}

/* ═══════════════ ĐIỀU HƯỚNG ═══════════════ */
function buildNav(){
  $('#railNav').innerHTML = NAV.map(n=>
    `<button data-v="${n.v}" class="${n.v===S.view?'on':''}">
       <svg class="ic" viewBox="0 0 24 24">${ICON[n.v]}</svg>${n.t}</button>`).join('');
  $('#tabbar').innerHTML = NAV.map(n=>
    `<button data-v="${n.v}" class="${n.v===S.view?'on':''}">
       <svg class="ic" viewBox="0 0 24 24">${ICON[n.v]}</svg>${n.t}</button>`).join('');
  $$('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
}
async function go(v){
  S.view=v;
  $$('#railNav [data-v],#tabbar [data-v]').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  NAV.forEach(n=>$(n.el).classList.toggle('hide', n.v!==v));
  $('#hTitle').textContent = NAV.find(n=>n.v===v).t;
  $('#periodBar').classList.toggle('hide', v==='cai' || v==='ls');
  exitMulti();
  if(v==='tk' && !S.allLoaded){
    $('#vTK').innerHTML = '<div class="empty"><b>Đang tải dữ liệu cả năm học…</b>Chỉ chậm ở lần đầu.</div>';
    try{ await loadAllMonths(); }catch(e){ err(e); }
  }
  if(v==='ls' && !S.allLoaded){
    $('#vLS').innerHTML = '<div class="empty"><b>Đang tải lịch sử…</b>Chỉ chậm ở lần đầu.</div>';
    try{ await loadAllMonths(); }catch(e){ err(e); }
  }
  renderAll();
}

/* ═══════════════ RENDER TỔNG ═══════════════ */
function renderAll(){
  renderPeriod();
  if(S.view==='ghi'){ renderFilters(); renderGhi(); }
  if(S.view==='bang') renderBang();
  if(S.view==='tk')   renderTK();
  if(S.view==='ls')   renderLS();
  if(S.view==='cai')  renderCai();
  setSync('ok');
}

function renderPeriod(){
  const bar=$('#periodBar'); bar.innerHTML='';
  const m=document.createElement('button');
  m.className='chip month'; m.textContent='Tháng '+S.thang+' ▾';
  m.onclick=openMonthPicker; bar.appendChild(m);
  for(let w=1; w<=S.cfg.soTuan; w++){
    const b=document.createElement('button');
    b.className='chip'+(w===S.tuan?' on':''); b.textContent='Tuần '+w;
    b.onclick=()=>{ S.tuan=w; renderAll(); };
    bar.appendChild(b);
  }
  const r=document.createElement('button');
  r.className='chip tiny'; r.textContent='↻';
  r.title='Tải lại dữ liệu'; r.onclick=()=>refresh(false);
  bar.appendChild(r);
}

function openMonthPicker(){
  const h = '<div style="padding:6px 0">' + MONTHS_YEAR.map(m=>
    `<button class="item" data-m="${m}"><span class="t"><b>Tháng ${m}</b>
     <span>${S.loaded.has(m)?'đã tải':'chưa tải'}</span></span>
     ${m===S.thang?'<span class="p" style="color:var(--teal)">✓</span>':''}</button>`).join('') + '</div>';
  openPanel('Chọn tháng', 'Năm học '+S.cfg.namHoc, h);
  $$('#pBody [data-m]').forEach(b=>b.onclick=async()=>{
    S.thang=Number(b.dataset.m); closePanel();
    try{ await loadMonths([S.thang]); renderAll(); }catch(e){ err(e); }
  });
}

/* ═══════════════ GHI ĐIỂM ═══════════════ */
function renderFilters(){
  const f=$('#toFilter'); f.innerHTML='';
  const opts = S.me.role==='Tổ trưởng' ? [String(S.me.to)] : ['all','1','2','3','4'];
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.className='chip tiny'+(String(S.filterTo)===o?' on':'');
    b.textContent = o==='all' ? 'Cả lớp' : 'Tổ '+o;
    b.onclick=()=>{ S.filterTo=o; renderFilters(); renderGhi(); };
    f.appendChild(b);
  });
}

function sparkline(ma){
  const vals=[]; for(let w=1;w<=S.cfg.soTuan;w++) vals.push(weekScore(ma,w));
  if(!vals.some(v=>v!==0)) return '';
  const W=46,H=18,lo=Math.min(0,...vals),hi=Math.max(0,...vals),rg=(hi-lo)||1;
  const x=i=>i*(W/Math.max(1,vals.length-1));
  const y=v=>H-2-((v-lo)/rg)*(H-4);
  const d=vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const last=vals[vals.length-1];
  const col=last<0?'var(--red)':last>0?'var(--green)':'var(--faint)';
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <line x1="0" y1="${y(0).toFixed(1)}" x2="${W}" y2="${y(0).toFixed(1)}" stroke="var(--rule)" stroke-width="1"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

function visibleStudents(){
  const q=S.q.trim().toLowerCase();
  let list=activeStudents().filter(s=>S.filterTo==='all'||String(s.to)===String(S.filterTo));
  if(q) list=list.filter(s=>s.ten.toLowerCase().includes(q));
  return list;
}

function renderGhi(){
  const box=$('#listGhi');
  const list=visibleStudents();
  $('#multiStrip').classList.toggle('hide', !S.multi);
  if(!list.length){ box.innerHTML='<div class="empty"><b>Không có học sinh nào</b>Thử xoá bớt từ khoá tìm kiếm.</div>'; return; }

  let h='', curTo=null;
  list.forEach((s,i)=>{
    if(S.filterTo==='all' && s.to!==curTo){ curTo=s.to; h+=`<div class="grouphead">Tổ ${esc(curTo)}</div>`; }
    const v=weekScore(s.ma,S.tuan), ri=rankIdx(v), locked=!canScore(s.to);
    h+=`<button class="row ${S.sel.has(s.ma)?'sel':''}" data-ma="${esc(s.ma)}">
      ${S.multi ? `<span class="check ${S.sel.has(s.ma)?'on':''}">
        <svg viewBox="0 0 24 24">${ICON.check}</svg></span>`
                : `<span class="idx">${i+1}</span>`}
      <span class="nm"><b>${esc(s.ten)}</b>
        <span>${esc(s.chucVu)}${locked?' · chỉ xem':''}</span></span>
      ${sparkline(s.ma)}
      <span class="score"><span class="n ${v===0?'zero':'r'+ri}">${v===0?'0':nz(v)}</span>
        <span class="l ${v===0?'zero':'r'+ri}">${esc(rankName(v))}</span></span>
    </button>`;
  });
  box.innerHTML=h;
  $$('#listGhi .row').forEach(b=>b.onclick=()=>{
    const ma=b.dataset.ma;
    if(S.multi){ toggleSel(ma); } else { openStudent(ma); }
  });

/* ── chọn nhiều ── */
$('#multiBtn').onclick=()=>{ S.multi ? exitMulti() : enterMulti(); };
$('#bulkCancel').onclick=()=>{ S.sel.clear(); updateBulk(); renderGhi(); };
$('#bulkGo').onclick=openBulkPanel;
$('#msDone').onclick=exitMulti;
$('#msAll').onclick=()=>{
  const list=visibleStudents().filter(s=>canScore(s.to));
  const allOn = list.length && list.every(s=>S.sel.has(s.ma));
  allOn ? list.forEach(s=>S.sel.delete(s.ma)) : list.forEach(s=>S.sel.add(s.ma));
  updateBulk(); renderGhi();
};

function enterMulti(){
  S.multi=true; S.sel.clear();
  $('#multiBtn').textContent='Xong';
  updateBulk(); renderGhi();
}

function toggleSel(ma){
  const s=stu(ma); if(!canScore(s.to)){ toast('Bạn chỉ ghi điểm được cho tổ '+S.me.to+'.'); return; }
  S.sel.has(ma) ? S.sel.delete(ma) : S.sel.add(ma);
  updateBulk(); renderGhi();
}
function updateBulk(){
  $('#bulkbar').classList.toggle('on', S.multi && S.sel.size>0);
  $('#bulkCount').textContent = 'Đã chọn '+S.sel.size+' học sinh';
  const strip=$('#msTxt');
  if(strip){
    strip.textContent = S.sel.size ? 'Đã chọn '+S.sel.size+' học sinh' : 'Chạm vào học sinh để chọn';
    const list=visibleStudents().filter(s=>canScore(s.to));
    const allOn = list.length && list.every(s=>S.sel.has(s.ma));
    $('#msAll').textContent = allOn ? 'Bỏ tất cả' : 'Chọn tất cả';
  }
}
function exitMulti(){
  S.multi=false; S.sel.clear();
  $('#bulkbar').classList.remove('on');
  const b=$('#multiBtn'); if(b) b.textContent='Chọn nhiều';
  const ms=$('#multiStrip'); if(ms) ms.classList.add('hide');
  if(S.view==='ghi') renderGhi();
}

/* ═══════════════ BẢNG LỚP ═══════════════ */
function renderBang(){
  $('#bangNote').textContent = `Tổng điểm mỗi tuần của tháng ${S.thang}. Ô màu thể hiện xếp loại tuần. Chạm tên để xem chi tiết.`;

  let h='<thead><tr><th class="name">Học sinh</th>';

        <div style="font-size:11px;color:var(--muted);font-weight:400">Tổ ${esc(s.to)}</div></td>`;

/* ═══════════════ PANEL ═══════════════ */
function openPanel(title, sub, html, kind){
  S.panelKind = kind || '';
  $('#pTitle').textContent=title; $('#pSub').textContent=sub; $('#pBody').innerHTML=html;
  $('#panel').classList.add('on'); $('#scrim').classList.add('on');
}
function closePanel(){ S.panelKind=''; $('#panel').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#scrim').onclick=closePanel;
$('#pClose').onclick=closePanel;
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePanel(); });

/* ── ghi điểm cho 1 học sinh ── */
function openStudent(ma){ S.ctxMa=ma; S.ctxTab='tru'; drawStudentPanel(); }

function catalogHTMLFor(tab){
  const cat=(tab==='tru'?S.tru:S.cong).filter(c=>c.active);
  if(!cat.length) return '<div class="empty"><b>Danh mục trống</b>Vào Cài đặt để thêm loại điểm.</div>';
  let h='', nhom=null;
  cat.forEach(c=>{
    if(c.nhom!==nhom){ nhom=c.nhom; h+=`<div class="grouphead">${esc(nhom)}</div>`; }
    h+=`<button class="item" data-add="${esc(c.ma)}">
          <span class="t"><b>${esc(c.noiDung)}</b><span>${esc(c.ma)}</span></span>
          <span class="p ${c.diem<0?'r3':'r0'}">${nz(c.diem)}</span></button>`;
  });
  return h;
}

function drawStudentPanel(){
  const s=stu(S.ctxMa);
  const sp=weekSplit(s.ma,S.tuan), v=sp.p+sp.m;
  const allowed=canScore(s.to);
  const mine=entriesOf(s.ma,S.thang,S.tuan);

  let h=`<div class="seg">
      <button class="minus ${S.ctxTab==='tru'?'on':''}" data-tab="tru">Trừ điểm</button>
      <button class="plus ${S.ctxTab==='cong'?'on':''}" data-tab="cong">Cộng điểm</button>
    </div>`;
  h += allowed ? catalogHTMLFor(S.ctxTab)
    : `<div class="empty"><b>Chỉ xem</b>Bạn phụ trách tổ ${esc(S.me.to)} nên không ghi điểm cho học sinh tổ ${esc(s.to)}.</div>`;

  h += `<div class="grouphead">Đã ghi trong tuần ${S.tuan} · ${mine.length} lượt</div>`;
  h += mine.length ? mine.map(entryHTML).join('')
                   : '<div class="note">Chưa có ghi nhận nào trong tuần này.</div>';
  h += `<div class="pform"><button class="btn ghost" id="pMonth">Xem cả tháng ${S.thang}</button></div>`;

  openPanel(s.ten,
    `Tổ ${s.to} · Tuần ${S.tuan}: cộng ${sp.p} · trừ ${sp.m} · tổng ${nz(v)} · ${rankName(v)}`, h, 'student');
  wirePanelEntries();
  $$('#pBody [data-tab]').forEach(b=>b.onclick=()=>{ S.ctxTab=b.dataset.tab; drawStudentPanel(); });
  $$('#pBody [data-add]').forEach(b=>b.onclick=()=>addEntry([s.ma], b.dataset.add));
  $('#pMonth').onclick=()=>openStudentMonth(s.ma);
}

function entryHTML(e){
  const own = e[E_EM].toLowerCase()===S.me.email || isAdmin();
  return `<div class="entry">
    <span class="pt ${e[E_DIEM]<0?'r3':'r0'}">${nz(e[E_DIEM])}</span>
    <span class="bd"><b>${esc(e[E_ND]||e[E_MUC])}</b>
      <span class="meta">T${e[E_TUAN]}/tháng ${e[E_THANG]} · ${esc(e[E_LUC])} · ${esc(e[E_TEN])}</span>
      ${e[E_GC]?`<span class="note">${esc(e[E_GC])}</span>`:''}</span>
    ${own?`<span class="act"><button data-edit="${esc(e[E_ID])}">Sửa</button>
      <button data-del="${esc(e[E_ID])}" style="color:var(--red)">Xoá</button></span>`:''}

}
function wirePanelEntries(){
  $$('#pBody [data-del]').forEach(b=>b.onclick=()=>delEntry(b.dataset.del));

/* ── ghi điểm hàng loạt ── */
function openBulkPanel(){
  const names=Array.from(S.sel).map(m=>stu(m).ten).join(', ');
  let h=`<div class="seg">
      <button class="minus ${S.ctxTab==='tru'?'on':''}" data-tab="tru">Trừ điểm</button>
      <button class="plus ${S.ctxTab==='cong'?'on':''}" data-tab="cong">Cộng điểm</button>

/* ── thêm / sửa / xoá bản ghi ── */
async function addEntry(maList, maMuc, ghiChu){
  const src = S.ctxTab==='tru' ? S.tru : S.cong;
  const c = src.find(x=>x.ma===maMuc); if(!c) return;
  const loai = S.ctxTab==='tru' ? 'Trừ' : 'Cộng';
  toast('<span class="spin"></span> Đang ghi…');
  try{
    const items = maList.map(ma=>({maHS:ma, loai:loai, maMuc:c.ma, diem:c.diem,
                                   noiDung:c.noiDung, ghiChu:ghiChu||''}));
    const r = await api('addEntries', {thang:S.thang, tuan:S.tuan, items:items});
    r.ids.forEach((id,i)=>{
      const s=stu(maList[i]);
      S.entries.push([id, r.serverTime||'vừa xong', S.thang, S.tuan, s.ma, s.to,
                      loai, c.ma, c.noiDung, c.diem, S.me.email, S.me.name, ghiChu||'']);
    });
    if(S.multi){ S.bulkNote=''; closePanel(); exitMulti(); } else { drawStudentPanel(); }
    renderAll();
    const label = maList.length>1 ? maList.length+' học sinh' : stu(maList[0]).ten;
    toast(`${esc(label)}: ${esc(c.noiDung)} <b>${nz(c.diem)}</b>`, ()=>{
      r.ids.forEach(id=>delEntry(id, true));
    });
  }catch(e){ err(e); }
}

async function delEntry(id, quiet){
  if(!quiet) toast('<span class="spin"></span> Đang xoá…');
  try{
    await api('deleteEntry', {id});
    S.entries = S.entries.filter(e=>e[E_ID]!==id);
    if(S.panelKind==='student' && S.ctxMa) drawStudentPanel();
    renderAll();
    toast('Đã xoá ghi nhận.');
  }catch(e){ err(e); }
}

function openEditEntry(id){
  const e = S.entries.find(x=>x[E_ID]===id); if(!e) return;
  const s = stu(e[E_MA]);
  const h=`<div class="pform">
    <div class="grid2">
      <div><label class="lbl" for="eTuan">Tuần</label>
        <select id="eTuan" class="inp s">${Array.from({length:S.cfg.soTuan},(_,i)=>
          `<option value="${i+1}" ${e[E_TUAN]===i+1?'selected':''}>Tuần ${i+1}</option>`).join('')}</select></div>
      <div><label class="lbl" for="eDiem">Điểm</label>
        <input id="eDiem" class="inp s" type="number" value="${e[E_DIEM]}"></div>
    </div>
    <label class="lbl" style="margin-top:11px" for="eGC">Ghi chú</label>
    <input id="eGC" class="inp s" value="${esc(e[E_GC])}">
    <div class="rowbtns"><button class="btn ghost" id="eCancel">Đóng</button>
      <button class="btn" id="eSave">Lưu</button></div>
    <div class="note" style="padding:12px 0 0">${esc(e[E_ND]||e[E_MUC])} · ghi bởi ${esc(e[E_TEN])} lúc ${esc(e[E_LUC])}</div>
  </div>`;
  openPanel('Sửa bản ghi', s?s.ten:e[E_MA], h, 'edit');
  $('#eCancel').onclick=()=>{ if(S.ctxMa) drawStudentPanel(); else closePanel(); };
  $('#eSave').onclick=async()=>{
    try{
      const tuan=Number($('#eTuan').value), diem=Number($('#eDiem').value), gc=$('#eGC').value;
      await api('updateEntry', {id, tuan, diem, ghiChu:gc});
      e[E_TUAN]=tuan; e[E_DIEM]=diem; e[E_GC]=gc; e[E_LOAI]= diem<0?'Trừ':'Cộng';
      if(S.panelKind==='edit' && S.ctxMa) drawStudentPanel(); else closePanel();
      renderAll(); toast('Đã lưu thay đổi.');
    }catch(er){ err(er); }
  };
}

/* ── xem cả tháng của một học sinh ── */
function openStudentMonth(ma){
  S.ctxMa=ma;
  const s=stu(ma);
  const rm=remarkOf(ma);
  let h='';
  if(rm && (rm.nhanXet || rm.xepLoai)){
    h+=`<div class="remarkbox" style="margin:14px 18px"><div class="h">Nhận xét của GVCN — tháng ${S.thang}</div>
        ${rm.xepLoai?`<p><b>Xếp loại chốt: ${esc(rm.xepLoai)}</b></p>`:''}
        ${rm.nhanXet?`<p>${esc(rm.nhanXet)}</p>`:''}</div>`;
  }
  h+='<div class="grouphead">Điểm theo tuần</div>';
  for(let w=1;w<=S.cfg.soTuan;w++){
    const v=weekScore(ma,w), sp=weekSplit(ma,w);
    h+=`<div class="entry"><span class="pt ${v<0?'r3':v>0?'r0':'zero'}">${nz(v)}</span>
      <span class="bd"><b>Tuần ${w}</b><span class="meta">cộng ${sp.p} · trừ ${sp.m} · ${rankName(v)}</span></span></div>`;
  }

  h+=`<div class="grouphead">Toàn bộ ghi nhận tháng ${S.thang} · ${list.length} lượt</div>`;
  h+= list.length ? list.map(entryHTML).join('') : '<div class="note">Chưa có ghi nhận nào.</div>';
  h+=`<div class="pform"><div class="rowbtns" style="margin-top:0">
      <button class="btn ghost" id="mHist">Lịch sử cả năm</button>
      ${isGVCN()?'<button class="btn" id="mRemark">Nhận xét</button>':''}</div></div>`;

  openPanel(s.ten,
    `Tổ ${s.to} · Tháng ${S.thang}: tổng ${nz(monthTotal(ma))} · TB ${monthAvg(ma).toFixed(1)} · ${rankName(monthAvg(ma))}`, h);
  wirePanelEntries();
  $('#mHist').onclick=async()=>{
    closePanel();
    if(!S.allLoaded){ toast('<span class="spin"></span> Đang tải cả năm…'); try{ await loadAllMonths(); }catch(e){ err(e); return; } }
    S.lsFilter.hs=ma; S.lsFilter.to='all'; hideToast(); go('ls');
  };
  if(isGVCN()) $('#mRemark').onclick=()=>openRemark(ma);
}

/* ═══════════════ BIỂU ĐỒ SVG ═══════════════ */
function svgCols(data, opts){
  const o = Object.assign({w:640,h:210,pad:30,fmt:v=>v.toFixed(1)}, opts||{});
  if(!data.length) return '<div class="note">Chưa có dữ liệu.</div>';
  const vals=data.map(d=>d.v);
  const hi=Math.max(0,...vals), lo=Math.min(0,...vals), rg=(hi-lo)||1;
  const bw=(o.w-o.pad*2)/data.length, y0=o.h-26-((0-lo)/rg)*(o.h-52);
  let s=`<svg viewBox="0 0 ${o.w} ${o.h}" style="width:100%;height:auto" role="img">`;
  s+=`<line x1="${o.pad-6}" y1="${y0.toFixed(1)}" x2="${o.w-o.pad+6}" y2="${y0.toFixed(1)}" stroke="var(--rule)" stroke-width="1"/>`;
  data.forEach((d,i)=>{
    const x=o.pad+i*bw+bw*0.22, w=bw*0.56;
    const yv=o.h-26-((d.v-lo)/rg)*(o.h-52);
    const top=Math.min(yv,y0), hh=Math.max(2,Math.abs(yv-y0));
    const col=d.c || (d.v<0?'var(--red)':'var(--teal)');
    s+=`<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${hh.toFixed(1)}"
         rx="3" fill="${col}" opacity=".9"/>`;
    s+=`<text x="${(x+w/2).toFixed(1)}" y="${(d.v<0?top+hh+13:top-6).toFixed(1)}" text-anchor="middle"
         font-size="12" font-weight="800" fill="${col}">${o.fmt(d.v)}</text>`;
    s+=`<text x="${(x+w/2).toFixed(1)}" y="${o.h-7}" text-anchor="middle" font-size="11.5"
         fill="var(--muted)">${esc(d.k)}</text>`;
  });
  return s+'</svg>';
}

function svgLine(data, opts){
  const o = Object.assign({w:640,h:200,pad:32,fmt:v=>v.toFixed(1)}, opts||{});
  const pts=data.filter(d=>d.v!==null);
  if(pts.length<1) return '<div class="note">Chưa có dữ liệu.</div>';
  const vals=pts.map(d=>d.v);
  const hi=Math.max(0,...vals), lo=Math.min(0,...vals), rg=(hi-lo)||1;
  const X=i=>o.pad+i*((o.w-o.pad*2)/Math.max(1,data.length-1));
  const Y=v=>o.h-28-((v-lo)/rg)*(o.h-54);
  let d='', dots='', prev=-1;
  data.forEach((p,i)=>{
    if(p.v===null) return;
    d += (prev<0?'M':'L')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)+' ';
    dots += `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.6" fill="var(--paper)"
              stroke="var(--teal)" stroke-width="2"/>
             <text x="${X(i).toFixed(1)}" y="${(Y(p.v)-11).toFixed(1)}" text-anchor="middle" font-size="11.5"
              font-weight="800" fill="var(--teal-ink)">${o.fmt(p.v)}</text>`;
    prev=i;
  });
  let s=`<svg viewBox="0 0 ${o.w} ${o.h}" style="width:100%;height:auto" role="img">`;
  s+=`<line x1="${o.pad-8}" y1="${Y(0).toFixed(1)}" x2="${o.w-o.pad+8}" y2="${Y(0).toFixed(1)}"
       stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/>`;
  s+=`<path d="${d.trim()}" fill="none" stroke="var(--teal)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  s+=dots;
  data.forEach((p,i)=>{ s+=`<text x="${X(i).toFixed(1)}" y="${o.h-7}" text-anchor="middle" font-size="11.5"
       fill="var(--muted)">${esc(p.k)}</text>`; });
  return s+'</svg>';
}

function hbars(rows, opts){
  const o=Object.assign({abs:true}, opts||{});
  if(!rows.length) return '<div class="note">Chưa có dữ liệu.</div>';
  const max=Math.max(...rows.map(r=>Math.abs(r.v)),1);
  return '<div class="hbars">'+rows.map(r=>`
    <div class="hbar"><span class="t">${esc(r.k)}</span>
      <span class="v ${r.v<0?'r3':'r0'}">${o.fmt?o.fmt(r.v):nz(r.v)}</span>
      <span class="track"><span class="fill ${r.v<0?'b3':'b0'}"
        style="width:${(Math.abs(r.v)/max*100).toFixed(1)}%"></span></span></div>`).join('')+'</div>';
}

/* ═══════════════ THỐNG KÊ ═══════════════ */
function renderTK(){
  const list=activeStudents();
  const ofMonth = S.entries.filter(e=>e[E_THANG]===S.thang);
  const luotCong = ofMonth.filter(e=>e[E_DIEM]>0).length;
  const luotTru  = ofMonth.filter(e=>e[E_DIEM]<0).length;
  const tbLop = list.length ? list.reduce((a,s)=>a+monthAvg(s.ma),0)/list.length : 0;

  const cnt=[0,0,0,0];
  list.forEach(s=>cnt[rankIdx(monthAvg(s.ma))]++);
  const tong=list.length||1;

  let h=`<div class="kpis">
    <div class="kpi"><div class="n">${list.length}</div><div class="l">Học sinh đang học</div>
      <div class="sub">4 tổ · tháng ${S.thang}</div></div>
    <div class="kpi"><div class="n r0">${luotCong}</div><div class="l">Lượt điểm cộng</div>
      <div class="sub">trong tháng ${S.thang}</div></div>
    <div class="kpi"><div class="n r3">${luotTru}</div><div class="l">Lượt điểm trừ</div>
      <div class="sub">trong tháng ${S.thang}</div></div>
    <div class="kpi"><div class="n ${'r'+rankIdx(tbLop)}">${tbLop.toFixed(1)}</div>
      <div class="l">Điểm TB tuần của lớp</div><div class="sub">${esc(rankName(tbLop))}</div></div>
  </div>`;

  h+=`<div class="sechead"><h2>Phân bố xếp loại tháng ${S.thang}</h2></div>
    <div class="panelbox"><div class="distbar">`;
  cnt.forEach((c,i)=>{ if(c) h+=`<div class="b${i}" style="width:${(c/tong*100).toFixed(1)}%">${c}</div>`; });
  h+=`</div><div class="legend">`+S.cfg.thresholds.map((t,i)=>
    `<span><i class="b${i}"></i>${esc(t.ten)} <b>${cnt[i]}</b></span>`).join('')+`</div></div>`;

  const tos=['1','2','3','4'];
  const toData=tos.map(t=>{
    const g=list.filter(s=>String(s.to)===t);
    return {k:'Tổ '+t, v:g.length? g.reduce((a,s)=>a+monthAvg(s.ma),0)/g.length : 0};
  });
  h+=`<div class="sechead"><h2>Điểm trung bình tuần theo tổ</h2></div>
      <div class="panelbox">${svgCols(toData)}</div>`;

  const trend=MONTHS_YEAR.map(m=>{
    const has=S.entries.some(e=>e[E_THANG]===m);
    if(!has) return {k:'T'+m, v:null};
    return {k:'T'+m, v: list.reduce((a,s)=>a+monthAvg(s.ma,m),0)/(list.length||1)};
  });
  h+=`<div class="sechead"><h2>Xu hướng điểm TB lớp qua các tháng</h2></div>
      <div class="panelbox">${svgLine(trend)}</div>`;

  const low=list.map(s=>({k:s.ten+' · tổ '+s.to, v:monthTotal(s.ma), ma:s.ma}))
    .filter(x=>x.v<0).sort((a,b)=>a.v-b.v).slice(0,10);
  h+=`<div class="sechead"><h2>Học sinh cần lưu ý — tháng ${S.thang}</h2></div>
      <div class="panelbox">${hbars(low)}</div>`;

  const byMuc={};
  ofMonth.filter(e=>e[E_DIEM]<0).forEach(e=>{
    const k=e[E_ND]||e[E_MUC]; byMuc[k]=(byMuc[k]||0)+1;
  });
  const topLoi=Object.keys(byMuc).map(k=>({k, v:byMuc[k]})).sort((a,b)=>b.v-a.v).slice(0,8);
  h+=`<div class="sechead"><h2>Lỗi vi phạm phổ biến</h2></div>
      <div class="panelbox">${hbars(topLoi.map(x=>({k:x.k, v:-x.v})), {fmt:v=>Math.abs(v)+' lượt'})}</div>`;

  $('#vTK').innerHTML = h;
}

/* ═══════════════ LỊCH SỬ & TRÍCH XUẤT ═══════════════ */
function lsRange(){
  const f=S.lsFilter;
  const i1=MONTHS_YEAR.indexOf(f.tu==null?MONTHS_YEAR[0]:f.tu);
  const i2=MONTHS_YEAR.indexOf(f.den==null?S.thang:f.den);
  const a=Math.min(i1,i2), b=Math.max(i1,i2);
  return MONTHS_YEAR.slice(a,b+1);
}
function lsData(){
  const f=S.lsFilter, months=lsRange();
  return S.entries.filter(e=>{
    if(months.indexOf(e[E_THANG])===-1) return false;
    if(f.hs!=='all' && e[E_MA]!==f.hs) return false;
    if(f.to!=='all' && String(e[E_TO])!==String(f.to)) return false;
    if(f.loai==='cong' && e[E_DIEM]<=0) return false;
    if(f.loai==='tru'  && e[E_DIEM]>=0) return false;
    return true;
  }).sort((a,b)=> b[E_THANG]-a[E_THANG] || b[E_TUAN]-a[E_TUAN] || String(b[E_LUC]).localeCompare(String(a[E_LUC])));
}

  h+=`<div class="kpis" style="margin-top:14px">
    <div class="kpi"><div class="n">${rows.length}</div><div class="l">Lượt ghi nhận</div></div>
    <div class="kpi"><div class="n r0">${nz(cong)}</div><div class="l">Tổng điểm cộng</div></div>
    <div class="kpi"><div class="n r3">${tru===0?'0':nz(tru)}</div><div class="l">Tổng điểm trừ</div></div>
    <div class="kpi"><div class="n ${'r'+rankIdx(cong+tru)}">${nz(cong+tru)}</div><div class="l">Điểm ròng</div></div>
  </div>`;

  const inScope = ma => f.hs!=='all' ? ma===f.hs
                    : (f.to==='all' ? true : (stu(ma) && String(stu(ma).to)===String(f.to)));
  const rm = S.remarks.filter(r=>months.indexOf(r.thang)!==-1 && inScope(r.maHS) && (r.nhanXet||r.xepLoai));
  if(rm.length){
    h+=`<div class="sechead"><h2>Nhận xét của GVCN · ${rm.length}</h2></div>`;

      h+=`<div class="remarkbox"><div class="h">${f.hs==='all'?esc(st?st.ten:r.maHS)+' · ':''}Tháng ${r.thang}${r.xepLoai?' · xếp loại chốt: '+esc(r.xepLoai):''}</div>
          ${r.nhanXet?`<p>${esc(r.nhanXet)}</p>`:''}</div>`;

          ${e[E_GC]?`<span class="note">${esc(e[E_GC])}</span>`:''}</span></div>`;
    });
    if(rows.length>400) h+=`<div class="note">Đang hiển thị 400 ghi nhận mới nhất. Xuất CSV để xem đầy đủ ${rows.length} dòng.</div>`;

  h+='</div>';

  $('#vLS').innerHTML=h;
  const bind=(id,key)=>$('#'+id).onchange=e=>{ S.lsFilter[key]= (key==='tu'||key==='den')?Number(e.target.value):e.target.value;
    if(key==='to') S.lsFilter.hs='all'; renderLS(); };
  bind('lsTu','tu'); bind('lsDen','den'); bind('lsTo','to'); bind('lsLoai','loai'); bind('lsHS','hs');
  $('#lsCSV').onclick=exportCSV;
  $('#lsPrint').onclick=printReport;
}

function lsTitle(){
  const f=S.lsFilter, months=lsRange();
  const ai = f.hs!=='all' ? (stu(f.hs)?stu(f.hs).ten:f.hs)
           : f.to!=='all' ? 'Tổ '+f.to : 'Toàn lớp 11D3';
  return ai + ' · tháng ' + months[0] + (months.length>1 ? '–'+months[months.length-1] : '');
}

function exportCSV(){
  const rows=lsData();
  const head=['Tháng','Tuần','Thời gian ghi','Mã HS','Họ và tên','Tổ','Loại','Mã mục','Nội dung','Điểm','Người ghi','Ghi chú'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines=[head.map(q).join(',')];
  rows.forEach(e=>{
    const s=stu(e[E_MA]);
    lines.push([e[E_THANG],e[E_TUAN],e[E_LUC],e[E_MA],s?s.ten:'',e[E_TO],e[E_LOAI],
                e[E_MUC],e[E_ND],e[E_DIEM],e[E_TEN],e[E_GC]].map(q).join(','));
  });
  const months=lsRange();
  S.remarks.filter(r=>months.indexOf(r.thang)!==-1 && (S.lsFilter.hs==='all'||r.maHS===S.lsFilter.hs))
    .forEach(r=>{
      const s=stu(r.maHS);
      lines.push([r.thang,'','','NHẬN XÉT GVCN',s?s.ten:r.maHS,s?s.to:'','','','Xếp loại chốt: '+(r.xepLoai||'—'),
                  '','GVCN',r.nhanXet].map(q).join(','));
    });
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='HanhKiem_11D3_'+lsTitle().replace(/[^\p{L}\p{N}]+/gu,'_')+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('Đã tải file CSV · '+rows.length+' dòng.');
}

function printReport(){

  if(f.hs!=='all'){
    const s=stu(f.hs);
    h+='<table><tr><th>Tháng</th>';
    for(let w=1;w<=S.cfg.soTuan;w++) h+=`<th>Tuần ${w}</th>`;
    h+='<th>Tổng</th><th>TB tuần</th><th>Xếp loại</th></tr>';
    months.forEach(m=>{
      let t=0; let tds='';
      for(let w=1;w<=S.cfg.soTuan;w++){ const v=weekScore(s.ma,w,m); t+=v; tds+=`<td>${v===0?'–':nz(v)}</td>`; }
      const a=t/(S.cfg.soTuan||1);

          <td>${esc(rm&&rm.xepLoai?rm.xepLoai:rankName(a))}</td></tr>`;

    months.forEach(m=>{
      const rm=remarkOf(s.ma,m);
      if(rm && rm.nhanXet) h+=`<div class="rm"><b>Nhận xét GVCN tháng ${m}:</b> ${esc(rm.nhanXet)}</div>`;
    });
  }

  if(f.hs==='all'){
    const scope = r => f.to==='all' || (stu(r.maHS) && String(stu(r.maHS).to)===String(f.to));
    const rms = S.remarks.filter(r=>months.indexOf(r.thang)!==-1 && scope(r) && (r.nhanXet||r.xepLoai));
    if(rms.length){
      h+='<h2 style="font-size:12pt;margin:14pt 0 4pt">Nhận xét của GVCN</h2>';
      rms.sort((a,b)=>a.thang-b.thang).forEach(r=>{
        const st=stu(r.maHS);
        h+=`<div class="rm"><b>${esc(st?st.ten:r.maHS)} — tháng ${r.thang}${r.xepLoai?' · '+esc(r.xepLoai):''}:</b> ${esc(r.nhanXet||'')}</div>`;
      });
    }
  }
  h+=`<h2 style="font-size:12pt;margin:14pt 0 4pt">Chi tiết ${rows.length} ghi nhận</h2>
    <table><tr><th>Tháng</th><th>Tuần</th><th>Thời gian</th><th>Học sinh</th><th>Tổ</th>
    <th>Nội dung</th><th>Điểm</th><th>Người ghi</th></tr>`;
  rows.forEach(e=>{
    const s=stu(e[E_MA]);
    h+=`<tr><td>${e[E_THANG]}</td><td>${e[E_TUAN]}</td><td>${esc(e[E_LUC])}</td>
        <td>${esc(s?s.ten:e[E_MA])}</td><td>${esc(e[E_TO])}</td>
        <td>${esc(e[E_ND]||e[E_MUC])}${e[E_GC]?' — '+esc(e[E_GC]):''}</td>
        <td style="text-align:right;font-weight:700">${nz(e[E_DIEM])}</td>
        <td>${esc(e[E_TEN])}</td></tr>`;
  });
  h+='</table>';

  $('#printArea').innerHTML=h;
  setTimeout(()=>window.print(), 60);
}

    try{
      const th=$$('.thName').map((el,i)=>({ten:el.value.trim()||S.cfg.thresholds[i].ten,
                                           san:Number($$('.thSan')[i].value)}));
      await api('saveConfig',{thresholds:th});
      S.cfg.thresholds=th; renderAll(); toast('Đã lưu mốc điểm.');
    }catch(e){ err(e); }
  };

  $$('[data-cat]').forEach(b=>b.onclick=()=>openCatEdit(b.dataset.cat, -1));
  $$('[data-cedit]').forEach(b=>b.onclick=()=>{
    const [k,i]=b.dataset.cedit.split(':'); openCatEdit(k, Number(i));
  });

  if(g('hsList')) g('hsList').onclick=openStudentList;
  if(g('hsAdd'))  g('hsAdd').onclick=()=>openStudentForm(null);
  if(g('hsTo'))   g('hsTo').onclick=openBulkTo;
  if(g('accAdd')) g('accAdd').onclick=()=>openAccountForm(null);
  $$('[data-acc]').forEach(b=>b.onclick=()=>openAccountForm(b.dataset.acc));

  if(g('nbSave')) g('nbSave').onclick=async()=>{
    try{
      const p={mode:g('nbMode').value, emails:g('nbEmails').value.trim(),
               nguong:Number(g('nbNguong').value), baoCong:g('nbCong').value==='1'};
      await api('saveNotify', p); S.thongBao=p; toast('Đã lưu cấu hình thông báo.');
    }catch(e){ err(e); }
  };
  if(g('nbTest')) g('nbTest').onclick=async()=>{
    toast('<span class="spin"></span> Đang gửi thư thử…');
    try{ const r=await api('testMail'); toast('Đã gửi. Còn '+r.quota+' thư trong hạn mức hôm nay.'); }
    catch(e){ err(e); }
  };

  g('myPw').onclick=openMyPassword;
  g('logout').onclick=()=>{ store.del('hk_token'); location.reload(); };
  g('dReload').onclick=()=>refresh(false);
  g('dAll').onclick=async()=>{
    toast('<span class="spin"></span> Đang tải cả năm…');
    try{ await loadAllMonths(true); renderAll(); toast('Đã tải '+S.entries.length+' bản ghi.'); }
    catch(e){ err(e); }
  };
}

/* ── sửa một mục điểm ── */
function openCatEdit(kind, idx){
  const arr = kind==='tru'?S.tru:S.cong;
  const isNew = idx<0;
  const c = isNew ? {ma:(kind==='tru'?'T':'C')+String(arr.length+1).padStart(2,'0'),
                     nhom:'Khác', noiDung:'', diem:(kind==='tru'?-1:1), active:true} : arr[idx];
  const nhoms=[...new Set(arr.map(x=>x.nhom).concat(['Nề nếp','Học tập','HĐTT','Nghiêm trọng','Khác']))];
  const h=`<div class="pform">
    <div class="grid2">
      <div><label class="lbl" for="cMa">Mã mục</label><input id="cMa" class="inp s" value="${esc(c.ma)}"></div>
      <div><label class="lbl" for="cDiem">Điểm ${kind==='tru'?'(số âm)':'(số dương)'}</label>
        <input id="cDiem" class="inp s" type="number" value="${c.diem}"></div>
    </div>
    <label class="lbl" style="margin-top:11px" for="cNhom">Nhóm</label>
    <select id="cNhom" class="inp s">${nhoms.map(n=>
      `<option ${c.nhom===n?'selected':''}>${esc(n)}</option>`).join('')}</select>
    <label class="lbl" style="margin-top:11px" for="cND">Nội dung</label>
    <input id="cND" class="inp s" value="${esc(c.noiDung)}" placeholder="VD: Đi học muộn">
    <label class="lbl" style="margin-top:11px" for="cAct">Đang áp dụng</label>
    <select id="cAct" class="inp s"><option value="1" ${c.active?'selected':''}>Có</option>
      <option value="0" ${c.active?'':'selected'}>Không</option></select>
    <div class="rowbtns"><button class="btn ghost" id="cCancel">Đóng</button>
      <button class="btn" id="cSave">${isNew?'Thêm mục':'Lưu'}</button></div>
    ${isNew?'':'<div class="rowbtns"><button class="btn danger" id="cDel">Xoá mục này</button></div>'}
    <div class="note" style="padding:12px 0 0">Xoá mục không ảnh hưởng các ghi nhận đã lưu trước đó.</div>
  </div>`;
  openPanel(isNew?'Thêm mục điểm':'Sửa mục điểm', kind==='tru'?'Danh mục điểm trừ':'Danh mục điểm cộng', h);
  $('#cCancel').onclick=closePanel;
  $('#cSave').onclick=async()=>{
    const rec={ma:$('#cMa').value.trim(), nhom:$('#cNhom').value, noiDung:$('#cND').value.trim(),
               diem:Number($('#cDiem').value), active:$('#cAct').value==='1'};
    if(!rec.ma || !rec.noiDung){ toast('Cần có mã mục và nội dung.'); return; }
    const next = arr.slice();
    isNew ? next.push(rec) : next[idx]=rec;
    await saveCat(kind, next, isNew?'Đã thêm mục.':'Đã lưu mục.');
  };
  if(!isNew) $('#cDel').onclick=async()=>{
    if(!confirm('Xoá mục “'+c.noiDung+'”?')) return;
    await saveCat(kind, arr.filter((_,i)=>i!==idx), 'Đã xoá mục.');
  };
}
async function saveCat(kind, items, msg){
  try{
    items.sort((a,b)=>String(a.nhom).localeCompare(String(b.nhom),'vi') || String(a.ma).localeCompare(String(b.ma)));
    await api('saveCatalog', {loai:kind, items});
    if(kind==='tru') S.tru=items; else S.cong=items;
    closePanel(); renderCai(); toast(msg);
  }catch(e){ err(e); }
}

/* ── danh sách lớp ── */
function openStudentList(){
  let h='', curTo=null;
  S.students.forEach(s=>{
    if(s.to!==curTo){ curTo=s.to; h+=`<div class="grouphead">Tổ ${esc(curTo)}</div>`; }
    h+=`<button class="item" data-edit="${esc(s.ma)}">
      <span class="t"><b>${esc(s.ten)}</b><span>${esc(s.ma)} · ${esc(s.chucVu)} · ${esc(s.trangThai)}</span></span>
      <span class="p" style="color:var(--teal);font-size:13px">Sửa</span></button>`;
  });
  openPanel('Danh sách lớp', S.students.length+' hồ sơ học sinh', h);
  $$('#pBody [data-edit]').forEach(b=>b.onclick=()=>openStudentForm(b.dataset.edit));
}

function openStudentForm(ma){
  const s = ma ? stu(ma) : {ma:'', ten:'', to:'1', chucVu:'Học sinh', email:'', trangThai:'Đang học', ghiChu:''};
  const isNew=!ma;
  let n=S.students.length+1, nextMa;
  do { nextMa='11D3-'+String(n++).padStart(2,'0'); } while(S.students.some(x=>x.ma===nextMa));
  const h=`<div class="pform">
    <div class="grid2">
      <div><label class="lbl" for="fMa">Mã học sinh</label>
        <input id="fMa" class="inp s" value="${esc(isNew?nextMa:s.ma)}" ${isNew?'':'readonly'}></div>
      <div><label class="lbl" for="fTo">Tổ</label>
        <select id="fTo" class="inp s">${[1,2,3,4].map(k=>
          `<option ${String(s.to)===String(k)?'selected':''}>${k}</option>`).join('')}</select></div>
    </div>
    <label class="lbl" style="margin-top:11px" for="fTen">Họ và tên</label>
    <input id="fTen" class="inp s" value="${esc(s.ten)}">
    <div class="grid2" style="margin-top:11px">
      <div><label class="lbl" for="fCv">Chức vụ</label><input id="fCv" class="inp s" value="${esc(s.chucVu)}"></div>
      <div><label class="lbl" for="fTt">Trạng thái</label>
        <select id="fTt" class="inp s">${['Đang học','Chuyển lớp','Nghỉ học','Bảo lưu'].map(o=>
          `<option ${s.trangThai===o?'selected':''}>${o}</option>`).join('')}</select></div>
    </div>
    <label class="lbl" style="margin-top:11px" for="fEm">Email (không bắt buộc)</label>
    <input id="fEm" class="inp s" value="${esc(s.email)}">
    <label class="lbl" style="margin-top:11px" for="fGc">Ghi chú</label>
    <input id="fGc" class="inp s" value="${esc(s.ghiChu)}">
    <div class="rowbtns"><button class="btn ghost" id="fCancel">Đóng</button>
      <button class="btn" id="fSave">${isNew?'Thêm vào lớp':'Lưu thay đổi'}</button></div>
    ${isNew?'':'<div class="rowbtns"><button class="btn danger" id="fDel">Xoá khỏi danh sách</button></div>'}
  </div>`;
  openPanel(isNew?'Thêm học sinh':'Sửa thông tin', isNew?'Nhập thông tin học sinh mới':esc(s.ma), h);
  $('#fCancel').onclick=closePanel;
  $('#fSave').onclick=async()=>{
    const rec={ma:$('#fMa').value.trim(), ten:$('#fTen').value.trim(), to:$('#fTo').value,
               chucVu:$('#fCv').value.trim()||'Học sinh', email:$('#fEm').value.trim(),
               trangThai:$('#fTt').value, ghiChu:$('#fGc').value.trim()};
    if(!rec.ma||!rec.ten){ toast('Cần có mã học sinh và họ tên.'); return; }
    const list=S.students.slice();
    const i=list.findIndex(x=>x.ma===rec.ma);
    i>=0 ? list[i]=rec : list.push(rec);
    await pushStudents(list, isNew?'Đã thêm học sinh.':'Đã lưu thay đổi.');
  };
  if(!isNew) $('#fDel').onclick=async()=>{
    if(!confirm('Xoá '+s.ten+' khỏi danh sách lớp? Các ghi nhận điểm cũ vẫn còn trong nhật ký.')) return;
    await pushStudents(S.students.filter(x=>x.ma!==s.ma), 'Đã xoá khỏi danh sách.');
  };
}

function openBulkTo(){
  const sel=new Set();
  const draw=()=>{
    let h=`<div class="pform"><label class="lbl" for="btTo">Chuyển các học sinh đã chọn sang</label>
      <select id="btTo" class="inp s">${[1,2,3,4].map(k=>`<option>${k}</option>`).join('')}</select>
      <div class="rowbtns"><button class="btn" id="btSave">Áp dụng cho ${sel.size} học sinh</button></div></div>`;
    let curTo=null;
    S.students.forEach(s=>{
      if(s.to!==curTo){ curTo=s.to; h+=`<div class="grouphead">Tổ ${esc(curTo)}</div>`; }
      h+=`<button class="item" data-p="${esc(s.ma)}">
        <span class="check ${sel.has(s.ma)?'on':''}"><svg viewBox="0 0 24 24">${ICON.check}</svg></span>
        <span class="t"><b>${esc(s.ten)}</b><span>${esc(s.ma)}</span></span></button>`;
    });
    openPanel('Đổi tổ hàng loạt', sel.size?sel.size+' học sinh đã chọn':'Chọn học sinh cần đổi tổ', h);
    $$('#pBody [data-p]').forEach(b=>b.onclick=()=>{
      const m=b.dataset.p; sel.has(m)?sel.delete(m):sel.add(m); draw();
    });
    $('#btSave').onclick=async()=>{
      if(!sel.size){ toast('Chưa chọn học sinh nào.'); return; }
      const to=$('#btTo').value;
      const list=S.students.map(s=>sel.has(s.ma)?Object.assign({},s,{to}):s);
      await pushStudents(list, 'Đã chuyển '+sel.size+' học sinh sang tổ '+to+'.');
    };
  };
  draw();
}

async function pushStudents(list, msg){
  try{
    const r=await api('saveStudents', {students:list});
    S.students=r.students; closePanel(); renderAll(); toast(msg);
  }catch(e){ err(e); }
}

/* ── tài khoản ── */
function openAccountForm(email){
  const a = email ? S.accounts.find(x=>x.email===email)
                  : {email:'', ten:'', role:'Tổ trưởng', to:'1', active:true};
  const isNew=!email;
  const h=`<div class="pform">
    <label class="lbl" for="aEm">Email đăng nhập</label>
    <input id="aEm" class="inp s" value="${esc(a.email)}" ${isNew?'':'readonly'} placeholder="ten@gmail.com">
    <label class="lbl" style="margin-top:11px" for="aTen">Họ và tên (hiện trong email thông báo)</label>
    <input id="aTen" class="inp s" value="${esc(a.ten)}">
    <div class="grid2" style="margin-top:11px">
      <div><label class="lbl" for="aRole">Vai trò</label>
        <select id="aRole" class="inp s">${['GVCN','Quản trị','Lớp trưởng','Tổ trưởng'].map(r=>
          `<option ${a.role===r?'selected':''}>${r}</option>`).join('')}</select></div>
      <div><label class="lbl" for="aTo">Tổ phụ trách</label>
        <select id="aTo" class="inp s">${['Tất cả','1','2','3','4'].map(t=>
          `<option ${String(a.to)===t?'selected':''}>${t}</option>`).join('')}</select></div>
    </div>
    <label class="lbl" style="margin-top:11px" for="aAct">Trạng thái</label>
    <select id="aAct" class="inp s"><option value="1" ${a.active?'selected':''}>Đang hoạt động</option>
      <option value="0" ${a.active?'':'selected'}>Đã khoá</option></select>
    ${isNew?`<label class="lbl" style="margin-top:11px" for="aPw">Mật khẩu ban đầu</label>
      <input id="aPw" class="inp s" value="11d3">`:''}
    <div class="rowbtns"><button class="btn ghost" id="aCancel">Đóng</button>
      <button class="btn" id="aSave">${isNew?'Thêm tài khoản':'Lưu'}</button></div>
    ${isNew?'':`<div class="rowbtns">
      <button class="btn ghost" id="aReset">Đặt lại mật khẩu</button>
      <button class="btn danger" id="aDel">Xoá tài khoản</button></div>`}
    <div class="note" style="padding:12px 0 0">Vai trò quyết định phạm vi ghi điểm: Tổ trưởng chỉ ghi cho tổ mình,
      Lớp trưởng ghi cả lớp và sửa danh mục, GVCN/Quản trị toàn quyền.</div>
  </div>`;
  openPanel(isNew?'Thêm tài khoản':'Sửa tài khoản', isNew?'Cấp quyền vào sổ':esc(a.email), h);
  $('#aCancel').onclick=closePanel;
  $('#aSave').onclick=async()=>{
    const rec={email:$('#aEm').value.trim().toLowerCase(), ten:$('#aTen').value.trim(),
               role:$('#aRole').value, to:$('#aTo').value, active:$('#aAct').value==='1'};
    if(!rec.email||!rec.ten){ toast('Cần có email và họ tên.'); return; }
    if(isNew) rec.matKhau=$('#aPw').value.trim()||'11d3';
    const list=S.accounts.slice();
    const i=list.findIndex(x=>x.email===rec.email);
    i>=0 ? list[i]=rec : list.push(rec);
    await pushAccounts(list, isNew?'Đã thêm tài khoản.':'Đã lưu tài khoản.');
  };
  if(!isNew){
    $('#aDel').onclick=async()=>{
      if(!confirm('Xoá tài khoản '+a.email+'?')) return;
      await pushAccounts(S.accounts.filter(x=>x.email!==a.email), 'Đã xoá tài khoản.');
    };
    $('#aReset').onclick=async()=>{
      const pw=prompt('Mật khẩu mới cho '+a.email, '11d3');
      if(!pw) return;
      try{ await api('resetPin',{email:a.email, newPin:pw}); toast('Đã đặt lại mật khẩu.'); }
      catch(e){ err(e); }
    };
  }
}
async function pushAccounts(list, msg){
  try{
    await api('saveAccounts', {accounts:list});
    S.accounts=list; closePanel(); renderCai(); toast(msg);
  }catch(e){ err(e); }
}

/* ── nhận xét GVCN ── */
function openRemark(ma){
  const s=stu(ma), rm=remarkOf(ma)||{xepLoai:'',nhanXet:''};
  const auto=rankName(monthAvg(ma));
  let w='';
  for(let i=1;i<=S.cfg.soTuan;i++) w+='Tuần '+i+': '+nz(weekScore(ma,i))+' · ';
  const h=`<div class="pform">
    <label class="lbl" for="rkXl">Xếp loại chốt (để trống = theo tự động: ${esc(auto)})</label>
    <select id="rkXl" class="inp s"><option value="">— theo tự động —</option>
      ${S.cfg.thresholds.map(t=>`<option ${rm.xepLoai===t.ten?'selected':''}>${esc(t.ten)}</option>`).join('')}</select>
    <label class="lbl" style="margin-top:11px" for="rkNx">Nhận xét tháng ${S.thang}</label>
    <textarea id="rkNx" class="inp" placeholder="Nhận xét về ý thức, nề nếp, tiến bộ của học sinh…">${esc(rm.nhanXet)}</textarea>
    <div class="rowbtns"><button class="btn ghost" id="rkCancel">Đóng</button>
      <button class="btn" id="rkSave">Lưu nhận xét</button></div></div>`;
  openPanel(s.ten, w+'TB '+monthAvg(ma).toFixed(1), h);
  $('#rkCancel').onclick=()=>openStudentMonth(ma);
  $('#rkSave').onclick=async()=>{
    try{
      const rec={thang:S.thang, maHS:ma, ten:s.ten, xepLoai:$('#rkXl').value, nhanXet:$('#rkNx').value};
      await api('saveRemark', rec);
      const i=S.remarks.findIndex(r=>r.maHS===ma && r.thang===S.thang);
      const obj={thang:S.thang, maHS:ma, xepLoai:rec.xepLoai, nhanXet:rec.nhanXet};
      i>=0 ? S.remarks[i]=obj : S.remarks.push(obj);
      closePanel(); renderAll(); toast('Đã lưu nhận xét.');
    }catch(e){ err(e); }
  };
}

/* ── mật khẩu của tôi ── */
function openMyPassword(){
  const h=`<div class="pform">
    <label class="lbl" for="p1">Mật khẩu hiện tại</label><input id="p1" class="inp s" type="password">
    <label class="lbl" style="margin-top:11px" for="p2">Mật khẩu mới (ít nhất 4 ký tự)</label>
    <input id="p2" class="inp s" type="password">
    <div class="rowbtns"><button class="btn ghost" id="pCancel">Đóng</button>
      <button class="btn" id="pSave">Đổi mật khẩu</button></div></div>`;
  openPanel('Đổi mật khẩu', esc(S.me.email), h);
  $('#pCancel').onclick=closePanel;
  $('#pSave').onclick=async()=>{
    try{
      const r=await api('changePin', {oldPin:$('#p1').value, newPin:$('#p2').value});
      if(r.ok===false) throw new Error(r.error);
      closePanel(); toast('Đã đổi mật khẩu.');
    }catch(e){ err(e); }
  };
}
